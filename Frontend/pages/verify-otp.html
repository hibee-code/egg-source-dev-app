<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — Egg Connect</title>
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="Verify Email — Egg Connect">
  <meta name="description" content="Enter your 6-digit verification code to activate your Egg Connect account.">
  <link rel="canonical" href="https://eggconnect.app/verify-otp">

  <!-- Favicon & PWA Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/logo-egg-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/logo-egg-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/logo-egg-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1f4d0a">

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  
  <style>
    .otp-page-viewport {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      position: relative;
      background: radial-gradient(circle at 50% 30%, rgba(31, 77, 10, 0.07) 0%, rgba(246, 248, 245, 0.5) 70%, #f6f8f5 100%);
    }

    .otp-page-viewport::before {
      content: '';
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(31, 77, 10, 0.12) 0%, rgba(31, 77, 10, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(40px);
      z-index: 0;
    }

    .otp-card-popup {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid rgba(31, 77, 10, 0.14);
      border-radius: 28px;
      padding: 40px 36px;
      box-shadow: 0 24px 60px -12px rgba(31, 77, 10, 0.12), 0 8px 24px -6px rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(16px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: popupSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popupSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .otp-icon-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px auto;
      background: linear-gradient(135deg, rgba(31, 77, 10, 0.08) 0%, rgba(31, 77, 10, 0.15) 100%);
      border: 2px solid rgba(31, 77, 10, 0.2);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 8px 20px rgba(31, 77, 10, 0.12);
    }

    .otp-icon-badge img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .otp-email-pill {
      display: inline-block;
      margin-top: 6px;
      padding: 6px 14px;
      background: rgba(31, 77, 10, 0.06);
      border: 1px solid rgba(31, 77, 10, 0.12);
      border-radius: 9999px;
      color: var(--color-primary);
      font-weight: 700;
      font-size: 0.92rem;
      word-break: break-all;
    }

    .otp-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 28px 0;
    }

    .otp-input {
      width: 52px;
      height: 60px;
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      border: 2px solid var(--color-border);
      border-radius: 14px;
      background: #fafafa;
      color: var(--color-primary);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
    }

    .otp-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(31, 77, 10, 0.18);
      background: #ffffff;
      transform: translateY(-2px);
    }

    .btn-verify-action {
      width: 100%;
      height: 52px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(31, 77, 10, 0.25);
      transition: all 0.25s ease;
    }

    .btn-verify-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(31, 77, 10, 0.35);
    }

    @media (max-width: 480px) {
      .otp-card-popup {
        padding: 30px 20px;
      }
      .otp-container {
        gap: 6px;
      }
      .otp-input {
        width: 42px;
        height: 52px;
        font-size: 1.4rem;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body class="page-auth">
  <div id="navbar-root"></div>

  <main class="otp-page-viewport">
    <div class="otp-card-popup">
      
      <!-- Card Icon Badge -->
      <div class="otp-icon-badge">
        <img src="/assets/images/logo-egg.svg" alt="Egg Connect Logo">
      </div>

      <!-- Title & Email info -->
      <div id="verify-header-group" style="text-align: center;">
        <h1 class="auth-title" style="font-size: 1.75rem; font-weight: 800; color: var(--color-text); margin: 0;">Verify Your Email</h1>
        <p class="auth-subtitle" style="margin-top: 8px; margin-bottom: 0; color: var(--color-text-muted); font-size: 0.95rem;">
          We sent a 6-digit verification code to
        </p>
        <div style="margin-top: 6px;">
          <span class="otp-email-pill" id="otp-target-email">your email</span>
        </div>
      </div>

      <!-- OTP FORM -->
      <form id="otp-form" class="auth-form" style="margin-top: 20px;">
        <div class="otp-container">
          <input type="text" maxlength="1" class="otp-input" data-index="0" inputmode="numeric" pattern="[0-9]*" autofocus autocomplete="one-time-code" aria-label="Digit 1">
          <input type="text" maxlength="1" class="otp-input" data-index="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 2">
          <input type="text" maxlength="1" class="otp-input" data-index="2" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 3">
          <input type="text" maxlength="1" class="otp-input" data-index="3" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 4">
          <input type="text" maxlength="1" class="otp-input" data-index="4" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 5">
          <input type="text" maxlength="1" class="otp-input" data-index="5" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 6">
        </div>

        <button id="otp-submit" type="submit" class="btn btn-gradient btn-verify-action">
          Verify OTP
        </button>
      </form>

      <!-- Resend OTP options -->
      <div style="margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--color-text-muted);">
        Didn't receive the code? 
        <button id="resend-otp-btn" type="button" class="forgot-pass-link" style="background: none; border: none; font-weight: 600; cursor: pointer; color: var(--color-primary);">
          Resend Code
        </button>
        <span id="resend-timer" style="display: none; margin-left: 4px; color: var(--color-text-muted); font-size: 0.85rem;"></span>
      </div>

      <!-- Return to Login -->
      <div style="margin-top: 20px; text-align: center;">
        <a href="/login" style="font-size: 0.85rem; color: var(--color-text-muted); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;">
          ← Back to Sign In
        </a>
      </div>

    </div>
  </main>

  <script type="module" src="/pages/verify-otp.js"></script>
</body>
</html>
