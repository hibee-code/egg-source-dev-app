<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Egg Connect</title>
  <meta name="description" content="Reset your Egg Connect password. Enter your email and we'll send you a secure reset link.">
  <link rel="canonical" href="https://eggconnect.app/forgot-password">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/logo-egg-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1f4d0a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

  <style>
    .auth-flow-viewport {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      position: relative;
      background: radial-gradient(circle at 50% 30%, rgba(31, 77, 10, 0.07) 0%, rgba(246, 248, 245, 0.5) 70%, #f6f8f5 100%);
    }

    .auth-flow-viewport::before {
      content: '';
      position: absolute;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(31, 77, 10, 0.10) 0%, rgba(31, 77, 10, 0) 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(50px);
      z-index: 0;
    }

    .auth-flow-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid rgba(31, 77, 10, 0.14);
      border-radius: 28px;
      padding: 44px 40px;
      box-shadow: 0 24px 60px -12px rgba(31, 77, 10, 0.12), 0 8px 24px -6px rgba(0, 0, 0, 0.04);
      animation: cardEntrance 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }

    .flow-icon-badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, rgba(31,77,10,0.08) 0%, rgba(31,77,10,0.16) 100%);
      border: 2px solid rgba(31, 77, 10, 0.18);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(31,77,10,0.12);
    }

    .flow-icon-badge i {
      color: var(--color-primary);
    }

    .flow-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--color-text);
      margin: 0 0 8px;
      text-align: center;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .flow-subtitle {
      font-size: 0.95rem;
      color: var(--color-text-muted);
      text-align: center;
      margin: 0 0 32px;
      line-height: 1.6;
    }

    .flow-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .flow-input {
      width: 100%;
      height: 52px;
      padding: 0 18px;
      background: #fafafa;
      border: 1.5px solid var(--color-border);
      border-radius: 14px;
      font-size: 0.97rem;
      font-weight: 500;
      color: var(--color-text);
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
      outline: none;
    }

    .flow-input:focus {
      border-color: var(--color-primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(31, 77, 10, 0.12);
    }

    .flow-input.input-error {
      border-color: #E34A4A;
      box-shadow: 0 0 0 4px rgba(227, 74, 74, 0.1);
    }

    .flow-input::placeholder {
      color: #b0bab0;
      font-weight: 400;
    }

    .flow-btn {
      width: 100%;
      height: 54px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(31,77,10,0.25);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flow-btn:hover:not(:disabled) {
      background: #173c08;
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(31,77,10,0.32);
    }

    .flow-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .flow-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success-state {
      display: none;
      text-align: center;
      animation: cardEntrance 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .success-icon-ring {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: rgba(31, 77, 10, 0.10);
      border: 2px solid rgba(31, 77, 10, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--color-text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--color-primary); }

    @media (max-width: 480px) {
      .auth-flow-card { padding: 32px 24px; }
      .flow-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body class="page-auth">
  <div id="navbar-root"></div>

  <main class="auth-flow-viewport">
    <div class="auth-flow-card">

      <!-- Default: request form -->
      <div id="form-state">
        <div class="flow-icon-badge">
          <i data-lucide="lock-keyhole" style="width:34px; height:34px;"></i>
        </div>

        <h1 class="flow-title">Forgot Password?</h1>
        <p class="flow-subtitle">No worries. Enter your registered email and we'll send you a secure reset link right away.</p>

        <form id="forgot-password-form" novalidate>
          <div style="margin-bottom: 6px;">
            <label class="flow-label" for="forgot-email">Email Address</label>
            <input
              id="forgot-email"
              type="email"
              class="flow-input"
              placeholder="you@example.com"
              autocomplete="email"
              inputmode="email"
              required
            >
          </div>

          <button id="forgot-submit-btn" type="submit" class="flow-btn">
            <i data-lucide="send" style="width:18px; height:18px;"></i>
            Send Reset Link
          </button>
        </form>

        <div style="text-align: center;">
          <a href="/login" class="back-link">
            <i data-lucide="arrow-left" style="width:14px; height:14px;"></i>
            Back to Sign In
          </a>
        </div>
      </div>

      <!-- Success state (shown after submit) -->
      <div id="success-state" class="success-state">
        <div class="success-icon-ring">
          <i data-lucide="mail-check" style="width:36px; height:36px; color: var(--color-primary);"></i>
        </div>
        <h2 style="font-size:1.5rem; font-weight:800; margin:0 0 10px; color:var(--color-text);">Check Your Inbox</h2>
        <p style="color:var(--color-text-muted); font-size:0.95rem; line-height:1.6; margin: 0 0 8px;">
          If an account with <strong id="success-email-display" style="color:var(--color-primary);"></strong> exists, a password reset link has been sent.
        </p>
        <p style="color:var(--color-text-muted); font-size:0.85rem; margin:0 0 28px;">Didn't get it? Check your spam folder or try again.</p>

        <button id="try-again-btn" class="flow-btn" style="max-width:240px; margin: 0 auto;">
          Try a Different Email
        </button>

        <div style="text-align: center;">
          <a href="/login" class="back-link">
            <i data-lucide="arrow-left" style="width:14px; height:14px;"></i>
            Back to Sign In
          </a>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="/pages/forgot-password.js"></script>
</body>
</html>
